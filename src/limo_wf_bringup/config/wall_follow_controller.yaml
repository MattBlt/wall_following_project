# Parametri dell'anello sull'angolo (fase 1, punto 2).
#
# I guadagni non si impostano direttamente: si sceglie il comportamento voluto
# dell'anello chiuso (omega_n e zeta) e il nodo ricava
#     K_d = omega_n^2 / v        K_psi = 2 * zeta * omega_n
# Dinamica risultante:  e'' + K_psi*e' + v*K_d*e = 0

wall_follow_controller:
  ros__parameters:

    enabled: false            # parte fermo: abilitare a mano quando si e' pronti
                              #   ros2 param set /wall_follow_controller enabled true

    d_ref: 0.30               # [m] distanza di riferimento dalla parete
    v_nominal: 0.40           # [m/s] costante nel punto 2; il punto 3 la modulera'

    omega_n: 1.0              # [rad/s] banda dell'anello chiuso. A 8 Hz di
                              # campionamento e' un fattore 50: ampio margine.
    zeta: 1.0                 # smorzamento critico: nessun sorpasso.
                              # 0.7 e' piu' rapido ma supera del 6%.

    max_omega: 1.5            # [rad/s] saturazione del comando
    v_min: 0.05               # [m/s] K_d = omega_n^2/v diverge per v->0

    # --- anello di velocita' (punto 3)
    # Profilo a decelerazione costante v = sqrt(2a(d - front_stop)), con a ricavata
    # dagli estremi: a = v_nominal^2 / (2*(d_slow - front_stop)) = 0.133 m/s^2.
    # Una rampa lineare darebbe un esponenziale nel tempo: 16 s contro 7 per lo
    # stesso avvicinamento, quasi tutti passati a strisciare sotto i 2 cm/s.

    d_slow: 1.00              # [m] da qui inizia a rallentare
    v_floor: 0.05             # [m/s] sotto questa va a zero, invece di strisciare
    accel_max: 0.30           # [m/s^2] aumento massimo della velocita'
    decel_max: 1.00           # [m/s^2] diminuzione massima della velocita'

    watchdog_timeout: 0.5     # [s] quattro scansioni perse a 8 Hz. Oltre, il robot
                              # si ferma invece di proseguire con l'ultimo comando.

    # --- ricerca della parete dopo uno spigolo
    v_search: 0.12            # [m/s]
    advance_distance: 0.20    # [m] tratto dritto prima di iniziare a ruotare
    omega_turn: 0.6           # [rad/s] rotazione sul posto (spigolo concavo)
    front_stop: 0.40          # [m] sotto cui si considera di avere un muro davanti
    front_release: 0.20       # [m] isteresi in uscita dalla virata
    front_turn: 0.75          # [m] sotto questa distanza frontale parte la virata ad arco
    v_turn: 0.25              # [m/s] velocita' lungo l'arco
    turn_radius_min: 0.22     # [m] raggio minimo dell'arco
    v_orbit: 0.30             # [m/s] velocita' massima attorno allo spigolo
    max_search_yaw: 2.62      # [rad] ~150 gradini